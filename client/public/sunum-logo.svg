<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="56" fill="#ffffff"/>
  <g transform="translate(151 26) scale(0.41)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8bf7"/>
      <stop offset="1" stop-color="#a93bf5"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8bf7"/>
      <stop offset="1" stop-color="#a93bf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="420" cy="92" r="150" fill="#ffffff" opacity="0.08"/>

  <!-- presentation board -->
  <g filter="url(#shadow)">
    <rect x="96" y="92" width="320" height="228" rx="30" fill="#ffffff"/>
  </g>
  <!-- easel stand -->
  <path d="M256 320 L256 352 M256 352 L204 420 M256 352 L308 420" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- hourglass on the board -->
  <g transform="translate(256 206)">
    <rect x="-56" y="-86" width="112" height="16" rx="8" fill="url(#glass)"/>
    <rect x="-56" y="70" width="112" height="16" rx="8" fill="url(#glass)"/>
    <path d="M-42 -70 L42 -70 C42 -32 10 -14 10 0 C10 14 42 32 42 70 L-42 70 C-42 32 -10 14 -10 0 C-10 -14 -42 -32 -42 -70 Z"
          fill="#eef2ff" stroke="url(#glass)" stroke-width="8" stroke-linejoin="round"/>
    <!-- sand: top (draining) + stream + bottom pile -->
    <path d="M-24 -40 L24 -40 C20 -26 6 -16 0 -8 C-6 -16 -20 -26 -24 -40 Z" fill="url(#sand)"/>
    <rect x="-2.5" y="-8" width="5" height="52" rx="2.5" fill="#f59e0b"/>
    <path d="M-34 64 C-26 42 -10 36 0 34 C10 36 26 42 34 64 Z" fill="url(#sand)"/>
  </g>

  <!-- steps 1-2-3 -->
  <g>
    <circle cx="196" cy="458" r="14" fill="#ffffff"/>
    <circle cx="256" cy="458" r="14" fill="#ffffff"/>
    <circle cx="316" cy="458" r="14" fill="#ffffff" opacity="0.45"/>
  </g>
</g>
  <text x="256" y="309" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="66" fill="#0f172a" letter-spacing="-2">Sunum</text>
  <text x="256" y="350" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="27" fill="#64748b">Dijital Sunum Koçu</text>
  <g transform="translate(215 366)">
    <rect width="82" height="26" rx="13" fill="#f59e0b"/>
    <text x="41" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#1f2937" letter-spacing="1.5">BETA</text>
  </g>
  <line x1="136" y1="420" x2="376" y2="420" stroke="#e2e8f0" stroke-width="2"/>
  <text x="150" y="468" font-family="Inter, sans-serif" font-style="italic" font-weight="500" font-size="22" fill="#94a3b8">by</text>
  <svg x="180" y="436" width="186" height="56" viewBox="140 188 658 196">
  <g fill="none" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#2c89f9">
      <!-- T -->
      <path d="M155 240 H205 M179 262 V329"/>
      <!-- E (three bars) -->
      <path d="M220 240 H272 M220 283 H268 M220 329 H272"/>
      <!-- K as a chevron -->
      <path d="M331 240 L288 284 L331 329"/>
      <!-- N -->
      <path d="M352 240 V300 M356 240 L417 329 M417 240 V329"/>
      <!-- head of the figure (O) -->
      <circle cx="482" cy="245" r="45"/>
    </g>
    <g stroke="#af2dfa">
      <!-- body of the figure (Λ) -->
      <path d="M439 370 L478 304 L517 370"/>
      <!-- D -->
      <path d="M541 240 H562 A44.5 44.5 0 0 1 562 329 H541"/>
      <!-- O -->
      <circle cx="664.5" cy="284" r="45.5"/>
      <!-- Z -->
      <path d="M728 240 H784 M776 262 L731 323 M731 329 H786"/>
    </g>
  </g>
</svg>
</svg>