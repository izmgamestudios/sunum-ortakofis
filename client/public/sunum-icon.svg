<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8bf7"/>
      <stop offset="1" stop-color="#a93bf5"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8bf7"/>
      <stop offset="1" stop-color="#a93bf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="420" cy="92" r="150" fill="#ffffff" opacity="0.08"/>

  <!-- presentation board -->
  <g filter="url(#shadow)">
    <rect x="96" y="92" width="320" height="228" rx="30" fill="#ffffff"/>
  </g>
  <!-- easel stand -->
  <path d="M256 320 L256 352 M256 352 L204 420 M256 352 L308 420" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- hourglass on the board -->
  <g transform="translate(256 206)">
    <rect x="-56" y="-86" width="112" height="16" rx="8" fill="url(#glass)"/>
    <rect x="-56" y="70" width="112" height="16" rx="8" fill="url(#glass)"/>
    <path d="M-42 -70 L42 -70 C42 -32 10 -14 10 0 C10 14 42 32 42 70 L-42 70 C-42 32 -10 14 -10 0 C-10 -14 -42 -32 -42 -70 Z"
          fill="#eef2ff" stroke="url(#glass)" stroke-width="8" stroke-linejoin="round"/>
    <!-- sand: top (draining) + stream + bottom pile -->
    <path d="M-24 -40 L24 -40 C20 -26 6 -16 0 -8 C-6 -16 -20 -26 -24 -40 Z" fill="url(#sand)"/>
    <rect x="-2.5" y="-8" width="5" height="52" rx="2.5" fill="#f59e0b"/>
    <path d="M-34 64 C-26 42 -10 36 0 34 C10 36 26 42 34 64 Z" fill="url(#sand)"/>
  </g>

  <!-- steps 1-2-3 -->
  <g>
    <circle cx="196" cy="458" r="14" fill="#ffffff"/>
    <circle cx="256" cy="458" r="14" fill="#ffffff"/>
    <circle cx="316" cy="458" r="14" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
